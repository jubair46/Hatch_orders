name: Build Hatch Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp site.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp icon.svg android/app/src/main/assets/
          cp icon-192.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/assets/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/hatch-orders-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatch-orders-v1.0.0-apk
          path: release-apk/hatch-orders-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Hatch Android App v1.0.0"
          body: |
            ## 📱 Hatch Mobile App — Android APK (v1.0.0)

            Download and install the official Hatch restaurant application directly on your Android phone!

            ### 🌟 Features in this Build:
            * **9 Culinary Counters**: Levant, Indian Regional, Kyoto, Chengdu, Oaxaca, Naples, Bengaluru Roastery, Dum Biryanis, and Farm Salads.
            * **Interactive Floor Plan**: 15 tables across 4 dining zones with live availability.
            * **Digital Steward Call Bell**: Instant waiter call with audio alerts on kitchen POS.
            * **Curbside Pickup**: Valet car delivery with vehicle model & license plate fields.
            * **Bengaluru Delivery Zones**: Indiranagar, Domlur, Koramangala, Ulsoor, CBD, Whitefield.
            * **Live Courier Tracking**: 4-stage animated receipt tracker.
            * **Dark Mode & PWA Support**: Fast offline loading and fullscreen mobile experience.

            ### 📥 Download:
            Download **`hatch-orders-v1.0.0.apk`** below to install on your phone.
          files: release-apk/hatch-orders-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
