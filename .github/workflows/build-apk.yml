name: Build Hatch Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp site.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp icon.svg android/app/src/main/assets/
          cp icon-192.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/assets/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/hatch-orders-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatch-orders-v1.0.0-apk
          path: release-apk/hatch-orders-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: "Hatch Android App v1.1.0 (Luxury Edition)"
          body: |
            ## 📱 Hatch Mobile App — Android APK (v1.1.0)

            Download and install the luxury Hatch restaurant application directly on your Android phone!

            ### 🌟 Latest Additions in v1.1.0:
            * **Dish Customization Studio**: Customise every dish with portion sizes, 4-tier spice levels (🟢 Mild to 🔥 Extra Hot), premium protein/base selections, gourmet add-ons with live price deltas, and bespoke chef preparation instructions.
            * **22-Page Master Cuisine Catalogue**: Expanded Indian Kitchen, authentic Thai Orchid counter, Kyoto sushi & ramen, Chengdu dim sum & wok, artisanal bakery, and handcrafted beverages.
            * **Frictionless Zero-Failure Tri-Payment Engine**: Instant Dynamic UPI QR with 5-minute security countdown, realistic card processor simulator, and Pay at Table / Cash on Delivery.
            * **Obsidian Emerald & Champagne Gold UI**: Luxury dark glassmorphism, fluid micro-animations, interactive table floor plans, and sticky mobile quick-cart bar.
            * **Live Order Tracking & Thermal Receipt**: Real-time kitchen status stepper, digital steward call bell, KOT thermal printer format, and 1-tap WhatsApp receipt sharing.

            ### 📥 Download & Install:
            Download **`hatch-orders-v1.0.0.apk`** below to install on your Android device.
          files: release-apk/hatch-orders-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
