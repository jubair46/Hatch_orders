<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatch — Kitchen & Reservations POS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<style>
  :root{
    --ink:#14201a; --ink-card:#1d2c24; --paper:#f6efe1; --yolk:#d4a017;
    --new:#e08a42; --preparing:#5b8fd1; --done:#4da664; --cancelled:#c94a4a;
    --dinein:#b5502e; --takeaway:#3f6b4a; --delivery:#5a2a4d;
    --line: rgba(246,239,225,0.12);
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--ink); color:var(--paper); margin:0; padding:24px clamp(16px, 4vw, 36px);
    min-height:100vh;
  }
  header{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px;
    margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--line);
  }
  h1{
    font-family:Georgia,"Iowan Old Style",serif; font-style:italic; font-weight:600; margin:0 0 4px; font-size:32px;
    color:var(--paper); display:flex; align-items:center; gap:12px;
  }
  .hatch-badge{
    font-size:12px; font-style:normal; font-family:sans-serif; font-weight:600;
    background:rgba(212,160,23,0.18); color:var(--yolk); border:1px solid rgba(212,160,23,0.35);
    padding:3px 10px; border-radius:999px; letter-spacing:0.04em; text-transform:uppercase;
  }
  .subtitle{ opacity:0.6; font-size:13.5px; margin:0; }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  /* View tabs */
  .view-tabs{
    display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
  }
  .view-tab{
    background:rgba(246,239,225,0.05); border:1px solid var(--line);
    color:var(--paper); font-size:13.5px; font-weight:600;
    padding:10px 20px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:all .2s;
  }
  .view-tab:hover{ background:rgba(246,239,225,0.1); }
  .view-tab.active{ background:var(--yolk); color:var(--ink); border-color:var(--yolk); }
  .badge-count{
    background:rgba(255,255,255,0.15); color:currentColor;
    font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;
  }
  .view-tab.active .badge-count{ background:var(--ink); color:var(--yolk); }

  /* Stats grid */
  .stats{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .stat-card{
    background:rgba(246,239,225,0.04);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 20px;
    min-width:140px;
    flex:1 1 120px;
  }
  .stat-card .num{
    font-family:Georgia,serif; font-style:italic; font-size:26px; display:block; margin-bottom:2px;
  }
  .stat-card.new .num{ color:var(--new); }
  .stat-card.prep .num{ color:var(--preparing); }
  .stat-card.rev .num{ color:var(--yolk); }
  .stat-card .lbl{ font-size:11px; opacity:0.55; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }

  /* Toolbar */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search-box{
    flex:1 1 220px; position:relative; min-width:180px;
  }
  .search-box input{
    width:100%; background:rgba(246,239,225,0.06); border:1px solid var(--line);
    color:var(--paper); border-radius:999px; padding:9px 16px; font-size:13px; outline:none;
    transition:border-color .2s;
  }
  .search-box input:focus{ border-color:var(--yolk); }
  .btn{
    background:var(--yolk); color:var(--ink); border:none; padding:9px 18px;
    border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition:transform .1s, opacity .2s;
  }
  .btn:hover{ opacity:0.9; }
  .btn:active{ transform:scale(0.97); }
  .btn-outline{ background:none; border:1px solid var(--line); color:var(--paper); font-weight:500; }
  .btn-outline:hover{ background:rgba(246,239,225,0.08); }
  .btn-sound.muted{ opacity:0.5; border-color:rgba(255,255,255,0.2); }

  .filter-group{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .filter-chip{
    background:none; border:1px solid var(--line); color:var(--paper);
    padding:6px 14px; border-radius:999px; font-size:12px; cursor:pointer; opacity:0.75;
    font-weight:500;
  }
  .filter-chip.active{ background:var(--paper); color:var(--ink); opacity:1; border-color:var(--paper); font-weight:600; }
  .updated{ font-size:12px; opacity:0.5; margin-left:auto; display:flex; align-items:center; gap:6px; }
  .pulse-dot{
    width:8px; height:8px; border-radius:50%; background:#4da664; display:inline-block;
    animation:pulse 2s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.8);} }

  /* Orders & Reservations table */
  .table-wrap{
    background:var(--ink-card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{
    text-align:left; padding:12px 16px; font-size:11px; opacity:0.5;
    text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--line);
    background:rgba(20,32,26,0.4);
  }
  td{ padding:14px 16px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  tr.row-new td{ border-left:4px solid var(--new); background:rgba(224,138,66,0.04); }
  tr.row-preparing td{ border-left:4px solid var(--preparing); background:rgba(91,143,209,0.04); }
  tr.row-done td{ border-left:4px solid var(--done); opacity:0.65; }
  tr.row-confirmed td{ border-left:4px solid var(--yolk); background:rgba(212,160,23,0.03); }
  tr.row-seated td{ border-left:4px solid var(--done); opacity:0.7; }
  tr.row-cancelled td{ border-left:4px solid var(--cancelled); opacity:0.5; }

  .order-num{ font-family:Georgia,serif; font-size:15px; font-weight:700; color:var(--yolk); display:block; margin-bottom:2px; }
  .time-main{ display:block; font-weight:600; }
  .time-rel{ font-size:11px; opacity:0.5; }
  .item-line{ display:flex; justify-content:space-between; margin-bottom:4px; font-size:13px; }
  .item-name{ font-weight:500; }
  .item-meta{ font-size:11.5px; opacity:0.6; }
  .notes-box{
    margin-top:8px; background:rgba(212,160,23,0.1); border-left:3px solid var(--yolk);
    padding:5px 10px; border-radius:4px; font-size:11.5px; color:var(--yolk);
  }
  .total-cell{ font-family:Georgia,serif; font-style:italic; font-size:17px; white-space:nowrap; }
  .type-badge{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px;
    font-weight:600; text-transform:capitalize; margin-bottom:6px;
  }
  .type-badge.dine-in{ background:rgba(181,80,46,0.22); color:#ea997b; }
  .type-badge.takeaway{ background:rgba(63,107,74,0.25); color:#91d4a3; }
  .type-badge.delivery{ background:rgba(90,42,77,0.28); color:#d99fd0; }
  .customer-line{ font-size:12.5px; opacity:0.85; display:block; margin-top:2px; }

  /* Row actions */
  .action-btns{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .status-badge{
    padding:4px 10px; border-radius:6px; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; display:inline-block; margin-bottom:6px;
  }
  .status-badge.new{ background:rgba(224,138,66,0.2); color:var(--new); border:1px solid var(--new); }
  .status-badge.preparing{ background:rgba(91,143,209,0.2); color:var(--preparing); border:1px solid var(--preparing); }
  .status-badge.done{ background:rgba(77,166,100,0.2); color:var(--done); border:1px solid var(--done); }
  .status-badge.confirmed{ background:rgba(212,160,23,0.2); color:var(--yolk); border:1px solid var(--yolk); }
  .status-badge.seated{ background:rgba(77,166,100,0.2); color:var(--done); border:1px solid var(--done); }
  .status-badge.cancelled{ background:rgba(201,74,74,0.2); color:var(--cancelled); border:1px solid var(--cancelled); }

  .btn-action{
    background:none; border:1px solid var(--line); color:var(--paper); padding:4px 10px;
    border-radius:6px; font-size:11.5px; cursor:pointer; font-weight:500; transition:all .15s;
    white-space:nowrap;
  }
  .btn-action:hover{ background:rgba(246,239,225,0.1); border-color:var(--paper); }
  .btn-action.primary{ background:var(--yolk); color:var(--ink); border-color:var(--yolk); font-weight:600; }
  .btn-action.primary:hover{ background:#e6b73a; }
  .btn-action.ready{ background:var(--done); color:#fff; border-color:var(--done); font-weight:600; }
  .btn-action.danger{ color:#e06666; border-color:rgba(224,102,102,0.3); }
  .btn-action.danger:hover{ background:rgba(224,102,102,0.15); border-color:#e06666; }

  .wa-link{
    color:#25d366; text-decoration:none; font-size:11.5px; display:inline-flex; align-items:center; gap:4px;
    margin-top:4px;
  }
  .wa-link:hover{ text-decoration:underline; }

  .empty{ opacity:0.55; padding:64px 20px; text-align:center; font-size:14px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Hatch Kitchen &amp; POS <span class="hatch-badge">Staff Live</span></h1>
    <p class="subtitle">100ft Road, Indiranagar, Bengaluru • 9 Culinary Kitchens Dispatch &amp; Reservations</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline btn-sound" id="soundBtn" title="Toggle audio chime on new orders">🔔 Sound: On</button>
    <button class="btn btn-outline" id="siteBtn" onclick="window.open('/', '_blank')">🌐 Customer Site</button>
  </div>
</header>

<div class="view-tabs">
  <button class="view-tab active" id="tabOrders" onclick="switchTab('orders')">
    🍳 Kitchen Orders <span class="badge-count" id="badgeOrders">0</span>
  </button>
  <button class="view-tab" id="tabReservations" onclick="switchTab('reservations')">
    📅 Table Reservations <span class="badge-count" id="badgeReservations">0</span>
  </button>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <div class="search-box">
    <input type="search" id="searchBox" placeholder="Search order #, customer, table, item…">
  </div>
  <div class="filter-group" id="filterGroup">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="new">New</button>
    <button class="filter-chip" data-filter="preparing">Preparing</button>
    <button class="filter-chip" data-filter="done">Completed</button>
  </div>
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn btn-outline" id="exportBtn">Export CSV</button>
  <span class="updated"><span class="pulse-dot"></span> <span id="updatedAt">Connecting…</span></span>
</div>

<div class="table-wrap">
  <div id="content"><p class="empty">Loading kitchen orders…</p></div>
</div>

<script>
var currentTab = 'orders'; // 'orders' or 'reservations'
var currentFilter = 'all';
var searchQuery = '';
var lastOrders = [];
var lastReservations = [];
var knownOrderIds = new Set();
var soundEnabled = true;
var audioCtx = null;

// Initialize sound preference
try {
  var storedSound = localStorage.getItem('hatch_sound');
  if (storedSound !== null) soundEnabled = storedSound === '1';
} catch(e) {}
updateSoundBtn();

function updateSoundBtn(){
  var btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundEnabled ? '🔔 Sound: On' : '🔕 Sound: Off';
  btn.classList.toggle('muted', !soundEnabled);
}

document.getElementById('soundBtn').addEventListener('click', function(){
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('hatch_sound', soundEnabled ? '1' : '0'); } catch(e) {}
  updateSoundBtn();
  if (soundEnabled) playChime();
});

function playChime(){
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    var osc1 = audioCtx.createOscillator();
    var osc2 = audioCtx.createOscillator();
    var gain1 = audioCtx.createGain();
    var gain2 = audioCtx.createGain();

    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(659.25, now);
    gain1.gain.setValueAtTime(0.28, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(830.61, now + 0.15);
    gain2.gain.setValueAtTime(0.28, now + 0.15);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

    osc1.connect(gain1); gain1.connect(audioCtx.destination);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);

    osc1.start(now); osc1.stop(now + 0.6);
    osc2.start(now + 0.15); osc2.stop(now + 0.85);
  } catch(e){}
}

function timeAgo(iso){
  var diffMs = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
  document.getElementById('tabReservations').classList.toggle('active', tab === 'reservations');
  currentFilter = 'all';
  searchQuery = '';
  document.getElementById('searchBox').value = '';

  var filterGroup = document.getElementById('filterGroup');
  if (tab === 'orders') {
    document.getElementById('searchBox').placeholder = 'Search order #, customer, table, item…';
    filterGroup.innerHTML =
      '<button class="filter-chip active" data-filter="all">All</button>' +
      '<button class="filter-chip" data-filter="new">New</button>' +
      '<button class="filter-chip" data-filter="preparing">Preparing</button>' +
      '<button class="filter-chip" data-filter="done">Completed</button>';
    renderOrdersStats(lastOrders);
    renderOrdersTable(lastOrders);
  } else {
    document.getElementById('searchBox').placeholder = 'Search confirmation, guest name, phone, area…';
    filterGroup.innerHTML =
      '<button class="filter-chip active" data-filter="all">All</button>' +
      '<button class="filter-chip" data-filter="confirmed">Confirmed</button>' +
      '<button class="filter-chip" data-filter="seated">Seated</button>' +
      '<button class="filter-chip" data-filter="cancelled">Cancelled</button>';
    renderReservationsStats(lastReservations);
    renderReservationsTable(lastReservations);
  }
  bindFilterChips();
}

function bindFilterChips(){
  document.querySelectorAll('.filter-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      currentFilter = chip.getAttribute('data-filter');
      if (currentTab === 'orders') renderOrdersTable(lastOrders);
      else renderReservationsTable(lastReservations);
    });
  });
}

function renderOrdersStats(orders){
  var today = new Date().toDateString();
  var todays = orders.filter(function(o){ return new Date(o.createdAt).toDateString() === today; });
  var newCount = orders.filter(function(o){ return o.status === 'new'; }).length;
  var prepCount = orders.filter(function(o){ return o.status === 'preparing'; }).length;
  var revenue = todays.reduce(function(s,o){ return s + (Number(o.total) || 0); }, 0);

  document.getElementById('badgeOrders').textContent = newCount + prepCount;

  document.getElementById('stats').innerHTML =
    '<div class="stat-card new"><span class="num">' + newCount + '</span><span class="lbl">New Orders</span></div>' +
    '<div class="stat-card prep"><span class="num">' + prepCount + '</span><span class="lbl">In Preparation</span></div>' +
    '<div class="stat-card"><span class="num">' + todays.length + '</span><span class="lbl">Total Orders Today</span></div>' +
    '<div class="stat-card rev"><span class="num">₹' + revenue.toLocaleString('en-IN') + '</span><span class="lbl">Today\'s Revenue</span></div>';

  var activeCount = newCount + prepCount;
  document.title = (activeCount > 0 ? '(' + activeCount + ') ' : '') + 'Hatch — Kitchen POS';
}

function renderReservationsStats(resvs){
  var today = new Date().toISOString().slice(0,10);
  var todays = resvs.filter(function(r){ return r.date === today; });
  var confirmed = resvs.filter(function(r){ return r.status === 'confirmed'; }).length;
  var seated = resvs.filter(function(r){ return r.status === 'seated'; }).length;
  var totalGuests = todays.reduce(function(s,r){ return s + (Number(r.guests) || 0); }, 0);

  document.getElementById('badgeReservations').textContent = confirmed;

  document.getElementById('stats').innerHTML =
    '<div class="stat-card new"><span class="num">' + confirmed + '</span><span class="lbl">Active Bookings</span></div>' +
    '<div class="stat-card prep"><span class="num">' + todays.length + '</span><span class="lbl">Today\'s Bookings</span></div>' +
    '<div class="stat-card"><span class="num">' + totalGuests + '</span><span class="lbl">Today\'s Expected Guests</span></div>' +
    '<div class="stat-card rev"><span class="num">' + seated + '</span><span class="lbl">Tables Seated</span></div>';
}

function orderTypeExtra(o){
  if (o.orderType === 'dine-in' && o.tableNumber) return 'Table #' + o.tableNumber;
  if (o.orderType === 'delivery' && o.deliveryAddress) return o.deliveryAddress;
  return '';
}

function printKOT(o){
  var orderCode = o.orderNumber || ('HTC-' + o.id.slice(0,6).toUpperCase());
  var win = window.open('', '_blank', 'width=340,height=500');
  var items = o.items.map(function(it){
    return '<div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;"><strong>' + it.qty + ' × ' + it.name + '</strong><span>' + it.size + '</span></div>';
  }).join('');
  win.document.write(
    '<html><head><title>KOT ' + orderCode + '</title><style>' +
    'body{font-family:"Courier New",monospace;padding:18px;color:#000;}' +
    'h3{text-align:center;margin:0 0 4px;font-size:18px;}' +
    'h4{text-align:center;margin:0 0 12px;font-size:22px;border:2px dashed #000;padding:6px;}' +
    'hr{border:none;border-top:1px dashed #000;margin:10px 0;}' +
    '.meta{font-size:12px;margin-bottom:10px;}' +
    '</style></head><body>' +
    '<h3>*** KITCHEN ORDER TICKET ***</h3>' +
    '<h4>' + (o.orderType.toUpperCase()) + (o.tableNumber ? ' - TABLE ' + o.tableNumber : '') + '</h4>' +
    '<div class="meta">Order: ' + orderCode + '<br>Time: ' + new Date(o.createdAt).toLocaleTimeString() + (o.customerName ? '<br>Guest: ' + o.customerName : '') + '</div>' +
    '<hr>' + items + '<hr>' +
    (o.notes ? '<div style="margin-top:8px;"><strong>NOTES:</strong> ' + o.notes + '</div><hr>' : '') +
    '<div style="text-align:center;font-size:11px;margin-top:12px;">HATCH INDIRANAGAR</div>' +
    '</body></html>'
  );
  win.document.close();
  win.focus();
  win.print();
}

function printCustomerBill(o){
  var orderCode = o.orderNumber || ('HTC-' + o.id.slice(0,6).toUpperCase());
  var win = window.open('', '_blank', 'width=380,height=600');
  var items = o.items.map(function(it){
    return '<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;"><span>' + it.qty + ' × ' + it.name + ' (' + it.size + ')</span><span>₹' + (it.price*it.qty) + '</span></div>';
  }).join('');
  win.document.write(
    '<html><head><title>Receipt ' + orderCode + '</title><style>' +
    'body{font-family:"Courier New",monospace;padding:24px;color:#1a1a1a;}' +
    'h4{font-family:Georgia,serif;font-style:italic;text-align:center;font-size:22px;margin:0 0 2px;}' +
    '.meta{text-align:center;font-size:11.5px;opacity:0.75;margin:0 0 16px;line-height:1.5;}' +
    'hr{border:none;border-top:1px dashed #777;margin:12px 0;}' +
    '.total-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}' +
    '.grand{font-weight:700;font-size:16px;margin-top:6px;border-top:1px solid #000;padding-top:6px;}' +
    '.footer{text-align:center;font-size:11px;opacity:0.7;margin-top:18px;}' +
    '</style></head><body>' +
    '<h4>Hatch</h4>' +
    '<p class="meta">100 Feet Road, Indiranagar, Bengaluru 560038<br>' + new Date(o.createdAt).toLocaleString() + '<br>Order #' + orderCode + '</p>' +
    '<hr>' +
    '<p class="meta" style="text-align:left;">' +
      (o.customerName ? 'Guest: ' + o.customerName + '<br>' : '') +
      (o.customerPhone ? 'Phone: ' + o.customerPhone + '<br>' : '') +
      o.orderType.toUpperCase() + (o.tableNumber ? ' — Table ' + o.tableNumber : '') + (o.deliveryAddress ? ' — ' + o.deliveryAddress : '') +
    '</p>' +
    '<hr>' + items + '<hr>' +
    '<div class="total-line"><span>Subtotal</span><span>₹' + (o.subtotal||0) + '</span></div>' +
    (o.discount ? '<div class="total-line" style="color:#2e7d32;"><span>Promo (' + (o.promoCode||'PROMO') + ')</span><span>-₹' + o.discount + '</span></div>' : '') +
    '<div class="total-line"><span>GST (5%)</span><span>₹' + (o.gst||0) + '</span></div>' +
    '<div class="total-line grand"><span>Total</span><span>₹' + o.total + '</span></div>' +
    '<p class="footer">Thank you for dining with Hatch.<br>Nine culinary counters, one roof.</p>' +
    '</body></html>'
  );
  win.document.close();
  win.focus();
  win.print();
}

async function updateOrderStatus(orderId, newStatus){

function renderOrdersTable(orders){
  var content = document.getElementById('content');
  var filtered = orders;

  if (currentFilter !== 'all') {
    filtered = filtered.filter(function(o){ return o.status === currentFilter; });
  }

  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    filtered = filtered.filter(function(o){
      var matchNum = (o.orderNumber || '').toLowerCase().includes(q) || o.id.toLowerCase().includes(q);
      var matchCust = (o.customerName || '').toLowerCase().includes(q) || (o.customerPhone || '').toLowerCase().includes(q);
      var matchTable = (o.tableNumber || '').toLowerCase().includes(q) || (o.deliveryAddress || '').toLowerCase().includes(q);
      var matchItem = o.items && o.items.some(function(it){ return it.name.toLowerCase().includes(q); });
      return matchNum || matchCust || matchTable || matchItem;
    });
  }

  if (!filtered.length){
    content.innerHTML = '<p class="empty">' + (orders.length === 0 ? 'No orders placed yet today.' : 'No orders matching the current filter.') + '</p>';
    return;
  }

  var html = '<table><thead><tr>' +
    '<th>Order &amp; Time</th>' +
    '<th>Service &amp; Guest</th>' +
    '<th>Ordered Items</th>' +
    '<th>Bill</th>' +
    '<th>Status &amp; Actions</th>' +
    '</tr></thead><tbody>';

  filtered.forEach(function(o){
    var orderCode = o.orderNumber || ('HTC-' + o.id.slice(0,6).toUpperCase());
    var d = new Date(o.createdAt);
    var timeStr = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    var extra = orderTypeExtra(o);
    var type = o.orderType || 'dine-in';

    var itemsHtml = o.items.map(function(it){
      return '<div class="item-line"><span class="item-name">' + it.qty + ' × ' + it.name + '</span><span class="item-meta">(' + it.size + ')</span></div>';
    }).join('');

    var actionHtml = '';
    if (o.status === 'new') {
      actionHtml += '<button class="btn-action primary" onclick="updateOrderStatus(\'' + o.id + '\', \'preparing\')">⏳ Start Prep</button>';
    } else if (o.status === 'preparing') {
      actionHtml += '<button class="btn-action ready" onclick="updateOrderStatus(\'' + o.id + '\', \'done\')">✓ Mark Ready</button>';
    }

    var discountInfo = o.discount ? '<div style="font-size:11px;color:#4da664;font-family:sans-serif;font-weight:600;margin-top:2px;">🎟️ ' + (o.promoCode || 'PROMO') + ' (-₹' + o.discount + ')</div>' : '';

    html += '<tr class="row-' + o.status + '">' +
      '<td>' +
        '<span class="order-num">#' + orderCode + '</span>' +
        '<span class="time-main">' + timeStr + '</span>' +
        '<span class="time-rel">' + timeAgo(o.createdAt) + '</span>' +
      '</td>' +
      '<td>' +
        '<span class="type-badge ' + type + '">' + type + '</span>' +
        (extra ? '<span class="customer-line"><strong>' + extra + '</strong></span>' : '') +
        (o.customerName ? '<span class="customer-line">' + o.customerName + '</span>' : '') +
        (o.customerPhone ? '<span class="customer-line" style="opacity:0.6;">' + o.customerPhone + '</span>' : '') +
      '</td>' +
      '<td>' +
        itemsHtml +
        (o.notes ? '<div class="notes-box">📝 ' + o.notes + '</div>' : '') +
      '</td>' +
      '<td class="total-cell">₹' + o.total +
        discountInfo +
        '<div style="margin-top:8px; display:flex; gap:6px;">' +
          '<button class="btn-action" onclick="printCustomerBill(lastOrders.find(function(x){return x.id===\'' + o.id + '\'}))">🧾 Bill</button>' +
          '<button class="btn-action" onclick="printKOT(lastOrders.find(function(x){return x.id===\'' + o.id + '\'}))">🖨️ KOT</button>' +
        '</div>' +
      '</td>' +
      '<td>' +
        '<div class="action-btns">' +
          '<span class="status-badge ' + o.status + '">' + o.status + '</span>' +
          actionHtml +
          '<button class="btn-action danger" onclick="deleteOrder(\'' + o.id + '\')">✕ Void</button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  });

  html += '</tbody></table>';
  content.innerHTML = html;
}

function renderReservationsTable(resvs){

        (r.name || '').toLowerCase().includes(q) ||
        (r.phone || '').toLowerCase().includes(q) ||
        (r.email || '').toLowerCase().includes(q) ||
        (r.area || '').toLowerCase().includes(q) ||
        (r.date || '').toLowerCase().includes(q);
    });
  }

  if (!filtered.length){
    content.innerHTML = '<p class="empty">' + (resvs.length === 0 ? 'No reservations received yet.' : 'No reservations matching the current filter.') + '</p>';

      '</td>' +
      '<td>' +
        '<div class="action-btns">' +
          '<span class="status-badge ' + r.status + '">' + r.status + '</span>' +

  html += '</tbody></table>';

function exportCSV(){
  if (currentTab === 'orders') {
    if (!lastOrders.length){ alert('No orders to export.'); return; }
    var rows = [['Order Number','Time','Type','Customer','Phone','Table/Address','Items','Subtotal','Promo','Discount','GST','Total','Status']];
    lastOrders.forEach(function(o){
      var orderCode = o.orderNumber || ('HTC-' + o.id.slice(0,6).toUpperCase());
      var items = o.items.map(function(it){ return it.qty + 'x ' + it.name + ' (' + it.size + ')'; }).join('; ');
      rows.push([
        orderCode,
        new Date(o.createdAt).toLocaleString(),
        o.orderType || '',
        o.customerName || '',
        o.customerPhone || '',
        o.tableNumber || o.deliveryAddress || '',
        items,
        o.subtotal || 0,
        o.promoCode || '',
        o.discount || 0,
        o.gst || 0,
        o.total,
        o.status
      ]);
    });
    downloadCSV(rows, 'hatch-kitchen-orders-' + new Date().toISOString().slice(0,10) + '.csv');
  } else {
    if (!lastReservations.length){ alert('No reservations to export.'); return; }
    var rows = [['Confirmation','Booked At','Guest Name','Phone','Email','Date','Time','Guests','Area','Notes','Status']];
    lastReservations.forEach(function(r){
      rows.push([
        r.confirmation || '',
        new Date(r.createdAt).toLocaleString(),
        r.name || '',
        r.phone || '',
        r.email || '',
        r.date || '',
        r.time || '',
        r.guests || '',
        r.area || '',
        r.notes || '',
        r.status || ''
      ]);
    });
    downloadCSV(rows, 'hatch-table-reservations-' + new Date().toISOString().slice(0,10) + '.csv');
  }
}

function downloadCSV(rows, filename){
  var csv = rows.map(function(r){
    return r.map(function(cell){ return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob([csv], {type: 'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadAllData(){
  var apiBase = (window.location.protocol === 'file:' || (window.location.port && window.location.port !== '3001'))
    ? 'http://localhost:3001'
    : '';

  try {
    var [ordersRes, resvRes] = await Promise.all([
      fetch(apiBase + '/api/orders', {credentials:'include'}),
      fetch(apiBase + '/api/reservations', {credentials:'include'})
    ]);

    if (ordersRes.ok) {
      var orders = await ordersRes.json();
      var hasBrandNew = false;
      orders.forEach(function(o){
        if (!knownOrderIds.has(o.id)) {
          if (knownOrderIds.size > 0 && o.status === 'new') hasBrandNew = true;
          knownOrderIds.add(o.id);
        }
      });
      if (hasBrandNew) playChime();
      lastOrders = orders;
      if (currentTab === 'orders') {
        renderOrdersStats(orders);
        renderOrdersTable(orders);
      }
    }

    if (resvRes.ok) {
      var resvs = await resvRes.json();
      lastReservations = resvs;
      if (currentTab === 'reservations') {
        renderReservationsStats(resvs);
        renderReservationsTable(resvs);
      }
    }

    // Refresh badge counts
    var newCount = lastOrders.filter(function(o){ return o.status === 'new'; }).length;
    var prepCount = lastOrders.filter(function(o){ return o.status === 'preparing'; }).length;
    document.getElementById('badgeOrders').textContent = newCount + prepCount;
    var confResv = lastReservations.filter(function(r){ return r.status === 'confirmed'; }).length;
    document.getElementById('badgeReservations').textContent = confResv;

    document.getElementById('updatedAt').textContent = 'Live: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('content').innerHTML = '<p class="empty">Unable to connect to Hatch backend. Make sure server is running on port 3001.</p>';
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadAllData);
document.getElementById('exportBtn').addEventListener('click', exportCSV);

document.getElementById('searchBox').addEventListener('input', function(e){
  searchQuery = e.target.value.trim();
  if (currentTab === 'orders') renderOrdersTable(lastOrders);
  else renderReservationsTable(lastReservations);
});

bindFilterChips();

// Load immediately and poll every 6 seconds
loadAllData();
setInterval(loadAllData, 6000);
</script>
