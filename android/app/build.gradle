plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatch.orders'
    compileSdk 34

    defaultConfig {
        applicationId "com.hatch.orders"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "role"
    productFlavors {
        customer {
            dimension "role"
            applicationId "com.hatch.customer"
            versionName "1.2.0-customer"
            manifestPlaceholders = [appName: "Hatch Customer"]
            buildConfigField "String", "START_URL", "\"file:///android_asset/site.html\""
        }
        owner {
            dimension "role"
            applicationId "com.hatch.owner"
            versionName "1.2.0-owner"
            manifestPlaceholders = [appName: "Hatch Owner & POS"]
            buildConfigField "String", "START_URL", "\"file:///android_asset/admin.html\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
